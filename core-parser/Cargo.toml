[package]
name    = "mdx-parser"
version = "0.2.0"
edition = "2021"

[lib]
name       = "mdx_parser"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "test_parse"
path = "src/bin/test_parse.rs"

[dependencies]
pulldown-cmark = "0.10"
regex          = "1"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
wasm-bindgen   = { version = "0.2.93", optional = true }

[features]
default = []
wasm    = ["wasm-bindgen"]
ffi     = []

# wasm-pack reads this and automatically passes --features wasm at build time.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false