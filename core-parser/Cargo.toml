[package]
name    = "omni-mdx"
version = "1.1.0"
edition = "2021"
description = "A highly secure, DoS-resistant MDX parser and OCP binary protocol engine."
license = "MIT"
authors = [
    "Bruneteau Côme <dev@toaq.fr>",
    "TOAQ <oss@toaq.fr>"
]
repository = "https://github.com/TOAQ-oss/omni-mdx-core"
homepage    = "https://omni-core.org/mdx"
readme = "README.md"
keywords = ["mdx", "markdown", "parser", "wasm", "nextjs"]
categories = ["parsing", "text-processing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name       = "omni_mdx_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["dev-tools"]

[[test]]
name = "test_perf"
path = "tests/test_perf.rs"

[[test]]
name = "test_code"
path = "tests/test_code.rs"

[[test]]
name = "test_ast"
path = "tests/test_ast.rs"

[[test]]
name = "test_security"
path = "tests/test_security.rs"

[dependencies]
pulldown-cmark = "0.13"
regex          = "1"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

wasm-bindgen   = { version = "0.2.93", optional = true }
pyo3           = { version = "0.24.1", features = ["extension-module"], optional = true }
napi           = { version = "2", features = ["napi4"], optional = true }
napi-derive    = { version = "2", optional = true }

[dev-dependencies]
proptest = "1.4"

[build-dependencies]
napi-build = "2"

[features]
default = []
wasm    = ["wasm-bindgen"]
python  = ["pyo3"]
ffi     = []
node    = ["napi", "napi-derive"]
dev-tools  = []
fuzzing = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false