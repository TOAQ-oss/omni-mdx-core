name: NPM Coverage (Codecov)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build WASM
        working-directory: core-parser
        run: wasm-pack build --target web --features wasm

      - name: Prepare WASM for Next.js
        run: |
          mkdir -p packages/mdx-next/wasm
          cp core-parser/pkg/* packages/mdx-next/wasm/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM for tests
        run: |
          cd core-parser
          wasm-pack build --target web --features wasm
          mkdir -p ../packages/mdx-next/wasm
          cp pkg/* ../packages/mdx-next/wasm/
          
      - name: Run Tests with Coverage
        working-directory: packages/mdx-next
        run: npm test

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: packages/mdx-next/coverage/lcov.info
          flags: npm
          working-directory: packages/mdx-next
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}