name: Pull Request Check

on:
  pull_request:
    branches: [ main, canary ]
    paths:
      - 'packages/**'
      - 'core-parser/**'
      - 'Cargo.toml'
      - 'package.json'

permissions:
  contents: read
  
jobs:
  test-rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Check & Tests
        working-directory: core-parser
        run: |
          cargo check
          cargo test

  test-next-package:
    runs-on: ubuntu-latest
    needs: test-rust-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build -w @toaq-oss/omni-mdx

  test-python-package:
    runs-on: ubuntu-latest
    needs: test-rust-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: packages/mdx-python
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff mypy

      - name: Lint with Ruff
        working-directory: packages/mdx-python
        run: ruff check .

      - name: Type check with Mypy
        working-directory: packages/mdx-python
        run: mypy