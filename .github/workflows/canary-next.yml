name: Canary Publish @toaq-oss/omni-mdx

on:
  push:
    branches:
      - canary
    paths:
      - 'core-parser/**'
      - 'packages/mdx-next/**'

permissions:
  contents: read
  id-token: write

jobs:
  build-native-canary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win32-x64-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli

      - name: Inject Canary Version
        id: version
        shell: bash
        run: |
          TIMESTAMP=$(date +%s)
          OLD_VER=$(jq -r '.version' core-parser/package.json)
          NEW_VER="${OLD_VER}-canary.${TIMESTAMP}"
          # On met à jour core-parser pour que les subpackages natifs aient la bonne version
          cd core-parser && npm --no-git-tag-version version $NEW_VER
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Build native addon
        working-directory: core-parser
        run: napi build --platform --release --features node --target ${{ matrix.target }} --no-js

      - name: Create & Publish platform subpackage
        shell: bash
        run: |
          PKG_NAME="@toaq-oss/omni-mdx-${{ matrix.name }}"
          VERSION="${{ steps.version.outputs.version }}"
          NODE_FILE=$(ls core-parser/omni-mdx-core.*.node | head -1)
          mkdir -p platform-pkg
          cp "$NODE_FILE" "platform-pkg/omni-mdx-core.${{ matrix.name }}.node"
          cat > platform-pkg/package.json << PKGJSON
          {
            "name": "$PKG_NAME",
            "version": "$VERSION",
            "description": "Native addon for @toaq-oss/omni-mdx (${{ matrix.name }})",
            "license": "MIT",
            "main": "omni-mdx-core.${{ matrix.name }}.node",
            "files": ["omni-mdx-core.${{ matrix.name }}.node"],
            "os": ["$(echo ${{ matrix.name }} | cut -d- -f1)"],
            "cpu": ["$(echo ${{ matrix.name }} | cut -d- -f2)"],
            "repository": { "type": "git", "url": "git+https://github.com/TOAQ-oss/omni-mdx-core.git" }
          }
          PKGJSON
          cd platform-pkg
          npm publish --access public --tag canary

  build-wasm-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'
      - name: Build WASM
        working-directory: core-parser
        run: wasm-pack build --target web --features wasm
      - name: Clean wasm-pack generated files
        working-directory: core-parser/pkg
        run: rm -f package.json README.md
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-canary
          path: core-parser/pkg/
          retention-days: 1

  publish-canary:
    needs: [build-native-canary, build-wasm-canary]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-canary
          path: packages/mdx-next/wasm/

      - name: Inject Canary Version
        working-directory: packages/mdx-next
        run: |
          TIMESTAMP=$(date +%s)
          OLD_VER=$(jq -r '.version' package.json)
          npm --no-git-tag-version version ${OLD_VER}-canary.${TIMESTAMP}

      - name: Build & Publish JS package
        working-directory: packages/mdx-next
        run: |
          npm install --ignore-scripts
          npm run build
          npm publish --access public --tag canary