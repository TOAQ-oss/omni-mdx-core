name: Python PyPI Publish

on:
  push:
    branches:
      - main
    paths:
      - 'packages/mdx-python/**'
      - 'core-parser/**'
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and Inject Rust Module
        working-directory: core-parser
        run: |
          pip install maturin
          maturin build --release --features python --interpreter python3.11 --out ../packages/mdx-python/toaq_mdx/

      - name: Inject Binary (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          BIN_FILE=$(find . -path "*/release/*" -type f \( -name "*.so" -o -name "*.dylib" \) | head -n 1)
          cp "$BIN_FILE" packages/mdx-python/toaq_mdx/toaq_parser_core.so

      - name: Inject Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $BIN_FILE = Get-ChildItem -Path .\target\release\ -Recurse -Include *.dll, *.pyd | Select-Object -First 1
          Copy-Item $BIN_FILE.FullName -Destination packages\mdx-python\toaq_mdx\toaq_parser_core.pyd

      - name: Build Python Wheel
        working-directory: packages/mdx-python
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Retag Wheel (Linux/Mac)
        if: runner.os != 'Windows'
        working-directory: packages/mdx-python
        run: |
          pip install wheel
          if [ "${{ runner.os }}" == "Linux" ]; then
            OS_TAG="manylinux_2_17_x86_64"
          else
            OS_TAG=$(python -c "import sysconfig; print(sysconfig.get_platform().replace('-', '_').replace('.', '_'))")
          fi
          
          python -m wheel tags --platform-tag $OS_TAG dist/*any.whl
          rm dist/*any.whl

      - name: Retag Wheel (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/mdx-python
        run: |
          pip install wheel
          $WHEEL_FILE = Get-ChildItem dist\*any.whl | Select-Object -ExpandProperty FullName
          $OS_TAG = python -c "import sysconfig; print(sysconfig.get_platform().replace('-', '_').replace('.', '_'))"
          
          python -m wheel tags --platform-tag $OS_TAG $WHEEL_FILE
          
          Remove-Item $WHEEL_FILE

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: packages/mdx-python/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get all Wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Vérification visuelle (Debug)
        run: ls -R dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true