name: Python PyPI Publish

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      skip_version_check:
        description: 'Bypass version check and publish immediately'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  
jobs:
  check-version:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if package version changed
        id: check
        run: |
          if [ "${{ inputs.skip_version_check }}" == "true" ]; then
            echo "Version check bypassed manually."
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Si déclenchement manuel sans bypass, on force aussi true
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger without bypass — assuming version changed."
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          extract_version() {
            git show "$1:packages/mdx-python/pyproject.toml" 2>/dev/null \
              | grep -E '^version\s*=' | head -1 | sed 's/.*=\s*"\(.*\)"/\1/' \
              || echo "none"
          }
          CURRENT=$(extract_version HEAD)
          PREVIOUS=$(extract_version HEAD~1)
          echo "Current version : $CURRENT"
          echo "Previous version: $PREVIOUS"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "version_changed=true"  >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-wheels:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core-parser/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheel
        working-directory: packages/mdx-python
        run: |
          pip install maturin
          maturin build --release --out dist

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: packages/mdx-python/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [check-version, build-wheels]
    if: |
      needs.check-version.outputs.version_changed == 'true' &&
      needs.build-wheels.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get all Wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true