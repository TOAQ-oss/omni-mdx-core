name: Python PyPI Publish

on:
  push:
    branches:
      - canary
    paths:
      - 'core-parser/**'
      - 'packages/mdx-python/**'
  workflow_dispatch:
    inputs:
      skip_version_check:
        description: 'Bypass version check and publish immediately'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      version_suffix: ${{ steps.suffix.outputs.val }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether to run
        id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.skip_version_check }}" == "true" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              extract_version() {
                git show "$1:packages/mdx-python/pyproject.toml" 2>/dev/null \
                  | grep -E '^version\s*=' | head -1 | sed 's/.*=\s*"\(.*\)"/\1/' \
                  || echo "none"
              }
              CURRENT=$(extract_version HEAD)
              PREVIOUS=$(extract_version HEAD~1)
              if [ "$CURRENT" != "$PREVIOUS" ]; then
                echo "should_run=true" >> "$GITHUB_OUTPUT"
              else
                echo "should_run=false" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      - name: Generate version suffix
        id: suffix
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "val=.dev$(date +%s)" >> "$GITHUB_OUTPUT"
          else
            echo "val=" >> "$GITHUB_OUTPUT"
          fi

  build-wheels:
    needs: check-version
    if: needs.check-version.outputs.should_run == 'true'
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Inject Version Suffix (Canary only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          SUFFIX="${{ needs.check-version.outputs.version_suffix }}"
          cd packages/mdx-python
          sed -i.bak "s/version = \"\([^\"]*\)\"/version = \"\1$SUFFIX\"/" pyproject.toml
          # Mise à jour du Cargo.toml pour maturin
          sed -i.bak "s/version = \"\([^\"]*\)\"/version = \"\1$SUFFIX\"/" Cargo.toml || true

      - name: Build wheel
        working-directory: packages/mdx-python
        run: |
          pip install maturin
          maturin build --release --out dist

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: packages/mdx-python/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [check-version, build-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true