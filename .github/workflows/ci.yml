name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-core:
    name: Core Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core-parser/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        working-directory: core-parser
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: core-parser
        run: cargo clippy -- -D warnings
        env:
          PYO3_PYTHON: python3.13

      - name: Tests
        working-directory: core-parser
        run: cargo test --release
        env:
          PYO3_PYTHON: python3.13

  test-mdx-next:
    name: mdx-next (JS/WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core-parser/target
          key: ubuntu-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-wasm-

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WASM
        working-directory: core-parser
        run: wasm-pack build --target web --features wasm

      - name: Clean wasm-pack generated files
        working-directory: core-parser/pkg
        run: rm -f package.json README.md

      - name: Copy WASM to package
        run: |
          mkdir -p packages/mdx-next/wasm
          cp -r core-parser/pkg/* packages/mdx-next/wasm/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: packages/mdx-next
        run: npm install --ignore-scripts

      - name: Typecheck
        working-directory: packages/mdx-next
        run: npx tsc --noEmit

      - name: Run Vitest
        working-directory: packages/mdx-next
        run: npx vitest run --reporter=verbose

  test-mdx-python:
    name: mdx-python (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core-parser/target
          key: ${{ runner.os }}-cargo-py-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-py-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install Rust extension
        working-directory: core-parser
        run: |
          pip install maturin
          maturin develop --features python --release

      - name: Install Python dependencies
        working-directory: packages/mdx-python
        run: |
          pip install --upgrade pip
          pip install pytest
          pip install -e ".[dev]"

      - name: Run pytest
        working-directory: packages/mdx-python
        run: pytest tests/ -v --tb=short