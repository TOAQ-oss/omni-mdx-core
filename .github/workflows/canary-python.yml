name: Canary Python PyPI Publish

on:
  push:
    branches:
      - canary
    paths:
      - 'core-parser/**'
      - 'packages/mdx-python/**'

permissions:
  contents: read
  id-token: write

jobs:
  build-wheels-canary:
    name: Build Canary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Inject Canary Version
        shell: bash
        working-directory: packages/mdx-python
        run: |
          TIMESTAMP=$(date +%s)
          sed -i.bak "s/version = \"\([^\"]*\)\"/version = \"\1.dev${TIMESTAMP}\"/" pyproject.toml
          # On le fait aussi dans Cargo.toml car Maturin s'en sert souvent comme source de vérité
          sed -i.bak "s/version = \"\([^\"]*\)\"/version = \"\1.dev${TIMESTAMP}\"/" Cargo.toml || true

      - name: Build wheel
        working-directory: packages/mdx-python
        run: |
          pip install maturin
          maturin build --release --out dist

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-canary-${{ matrix.os }}
          path: packages/mdx-python/dist/*.whl

  publish-canary:
    name: Publish Canary to PyPI
    needs: [build-wheels-canary]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get all Wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-canary-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true