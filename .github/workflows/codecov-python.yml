name: Python Coverage (Codecov)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 libxcb-shape0 libxcb-cursor0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install build tools
        run: pip install maturin pytest PyQt5 pytest-xvfb matplotlib

      - name: Build Wheel
        working-directory: packages/mdx-python
        run: maturin build --out dist

      - name: Install built package
        run: pip install packages/mdx-python/dist/*.whl --force-reinstall

      - name: Run Tests with Coverage
        working-directory: packages/mdx-python
        run: pytest --cov=omni_mdx --cov-report=xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/mdx-python/coverage.xml
          flags: python
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}