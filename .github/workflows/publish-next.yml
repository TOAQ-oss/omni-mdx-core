name: NPM Next.js Publish

on:
  push:
    branches:
      - main
    paths:
      - 'packages/mdx-next/**'
      - 'core-parser/**'
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-tools-wasm-bindgen-0.2.95

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build Rust to WASM (Manual Method)
        working-directory: core-parser
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo install wasm-bindgen-cli --version 0.2.95
          
          cargo build --release --target wasm32-unknown-unknown
          
          mkdir -p pkg
          wasm-bindgen ../target/wasm32-unknown-unknown/release/mdx_parser.wasm \
                       --out-dir pkg \
                       --target bundler \
                       --typescript

      - name: Install Dependencies & Build Next Package
        working-directory: packages/mdx-next
        run: |
          npm ci
          npm run build

      - name: Publish to NPM
        working-directory: packages/mdx-next
        run: |
          echo "//registry.npmjs.org/:aud=https://registry.npmjs.org/" > .npmrc
          npm publish --access public --provenance --ignore-scripts
