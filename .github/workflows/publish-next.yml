name: NPM Next.js Publish

on:
  push:
    branches:
      - main
    # Ne se lance QUE si tu modifies le Next.js ou le cœur Rust
    paths:
      - 'packages/mdx-next/**'
      - 'core-parser/**'
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # 1. Préparation de l'environnement Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 2. Installation de wasm-pack
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      # 3. Compilation (On force la mise à jour des dépendances WASM)
      - name: Build Rust to WASM
        working-directory: core-parser
        env:
          RUSTUP_TOOLCHAIN: stable # <--- FORCE L'USAGE DE STABLE ICI
        run: |
          # Supprimer le cache local de wasm-pack pour forcer une réinstallation propre des outils
          rm -rf ~/.cache/.wasm-pack
          
          # Lancer le build
          wasm-pack build --target bundler --release
          
      # 4. Préparation du package NPM
      - name: Install Dependencies & Build Next Package
        working-directory: packages/mdx-next
        run: |
          # Installation des dépendances classiques
          npm ci
          # Construction du build Next.js / de ta librairie React
          npm run build

      # 5. Publication
      - name: Publish to NPM (Simulation)
        working-directory: packages/mdx-next
        run: npm publish --access public --provenance --dry-run