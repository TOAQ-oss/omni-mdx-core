name: Publish @toaq-oss/omni-mdx

on:
  push:
    branches:
      - canary
    paths:
      - 'core-parser/**'
      - 'packages/mdx-next/**'
  workflow_dispatch:
    inputs:
      skip_version_check:
        description: 'Bypass version check and publish immediately'
        required: false
        default: false
        type: boolean
      force_core:
        description: 'Force rebuild of Native Core & WASM binaries'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is_canary: ${{ github.event_name == 'push' }}
      should_run: ${{ steps.check.outputs.should_run }}
      build_core: ${{ steps.check.outputs.build_core }}
      version: ${{ steps.version.outputs.val }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine Version and Run Logic
        id: check
        shell: bash
        run: |
          # Par défaut, on ne build pas
          SHOULD_RUN="false"
          BUILD_CORE="false"

          if [ "${{ github.event_name }}" == "push" ]; then
            # Mode Canary : Toujours exécuter
            SHOULD_RUN="true"
            BUILD_CORE="true"
          else
            # Mode Stable : Vérification manuelle
            if [ "${{ inputs.skip_version_check }}" == "true" ]; then
              SHOULD_RUN="true"
            else
              CURRENT=$(jq -r '.version' packages/mdx-next/package.json)
              PREVIOUS=$(git show HEAD~1:packages/mdx-next/package.json 2>/dev/null | jq -r '.version' || echo "none")
              if [ "$CURRENT" != "$PREVIOUS" ]; then SHOULD_RUN="true"; fi
            fi

            if [ "${{ inputs.force_core }}" == "true" ]; then
              BUILD_CORE="true"
            else
              CORE_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -c '^core-parser/' || true)
              if [ "$CORE_CHANGED" -gt "0" ]; then BUILD_CORE="true"; fi
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "build_core=$BUILD_CORE" >> "$GITHUB_OUTPUT"

      - name: Compute Final Version String
        id: version
        shell: bash
        run: |
          BASE_VER=$(jq -r '.version' packages/mdx-next/package.json)
          if [ "${{ github.event_name }}" == "push" ]; then
            FINAL_VER="${BASE_VER}-canary.$(date +%s)"
          else
            FINAL_VER="$BASE_VER"
          fi
          echo "val=$FINAL_VER" >> "$GITHUB_OUTPUT"

  build-native:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.build_core == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli

      - name: Set Version for Build
        shell: bash
        run: cd core-parser && npm --no-git-tag-version version ${{ needs.prepare.outputs.version }}

      - name: Build native addon
        working-directory: core-parser
        run: napi build --platform --release --features node --target ${{ matrix.target }} --no-js

      - name: Create & Publish platform subpackage
        shell: bash
        run: |
          PKG_NAME="@toaq-oss/omni-mdx-${{ matrix.name }}"
          NODE_FILE=$(ls core-parser/omni-mdx-core.*.node | head -1)
          mkdir -p platform-pkg
          cp "$NODE_FILE" "platform-pkg/omni-mdx-core.${{ matrix.name }}.node"
          
          cat > platform-pkg/package.json << PKGJSON
          {
            "name": "$PKG_NAME",
            "version": "${{ needs.prepare.outputs.version }}",
            "main": "omni-mdx-core.${{ matrix.name }}.node",
            "os": ["$(echo ${{ matrix.name }} | cut -d- -f1)"],
            "cpu": ["$(echo ${{ matrix.name }} | cut -d- -f2)"],
            "publishConfig": { "access": "public" },
            "repository": { "type": "git", "url": "git+https://github.com/TOAQ-oss/omni-mdx-core.git" }
          }
          PKGJSON
          
          cd platform-pkg
          if [ "${{ needs.prepare.outputs.is_canary }}" == "true" ]; then
            npm publish --tag canary --provenance
          else
            npm publish --provenance
          fi

      - name: Upload .node artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: core-parser/omni-mdx-core.*.node
          retention-days: 1

  build-wasm:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      
      - name: Build WASM
        working-directory: core-parser
        run: wasm-pack build --target web --features wasm
        
      - name: Clean wasm-pack noise
        working-directory: core-parser/pkg
        run: rm -f package.json README.md

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-artifact
          path: core-parser/pkg/
          retention-days: 1

  publish:
    needs: [prepare, build-native, build-wasm]
    if: |
      always() && 
      needs.prepare.outputs.should_run == 'true' &&
      needs.build-wasm.result == 'success' &&
      (needs.build-native.result == 'success' || needs.build-native.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifact
          path: packages/mdx-next/wasm/

      - name: Download Native (if built)
        if: needs.build-native.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages/mdx-next/native/
          merge-multiple: true

      - name: Finalize version and Publish
        working-directory: packages/mdx-next
        run: |
          npm --no-git-tag-version version ${{ needs.prepare.outputs.version }}
          npm install --ignore-scripts
          npm run build
          
          if [ "${{ needs.prepare.outputs.is_canary }}" == "true" ]; then
            npm publish --access public --tag canary --provenance
          else
            npm publish --access public --provenance
          fi
      
      - name: Update GitHub Release (NPM & WASM)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: |
            packages/mdx-next/wasm/*.wasm
            packages/mdx-next/native/*.node
          draft: true
          generate_release_notes: true