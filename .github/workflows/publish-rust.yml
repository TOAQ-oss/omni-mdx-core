name: Publish Rust Crate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check if the crate is valid without publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: core-parser

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify build
        run: cargo check --features wasm,python,dev-tools

      - name: Run core tests
        run: cargo test --features wasm,python

      - name: Dry Run (Optional)
        if: ${{ inputs.dry_run == true }}
        run: cargo publish --dry-run

      - name: Extract Version from Cargo.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -m 1 '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io
        if: ${{ inputs.dry_run == false }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          VERSION=$(grep -m 1 '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: Omni-MDX-CI (oss@toaq.fr)" \
            "https://crates.io/api/v1/crates/omni-mdx/$VERSION")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "⚠️ Version $VERSION already exists on crates.io. Skipping publish."
          elif [ "$HTTP_STATUS" -eq 404 ]; then
            echo "🚀 Version $VERSION not found. Publishing..."
            cargo publish
          else
            echo "❌ Unexpected API response (HTTP $HTTP_STATUS). Manual check required."
            exit 1
          fi

      - name: Update GitHub Release (Rust)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry_run == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          draft: true