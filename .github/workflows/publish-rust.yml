name: Publish Rust Crate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check if the crate is valid without publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: core-parser

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify build
        run: cargo check --features wasm,python,dev-tools

      - name: Run core tests
        run: cargo test --features wasm,python

      - name: Dry Run (Optional)
        if: ${{ inputs.dry_run == true }}
        run: cargo publish --dry-run

      - name: Extract Version from Cargo.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -m 1 '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io
        if: ${{ inputs.dry_run == false }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          VERSION=$(grep -m 1 '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          
          EXISTS=$(curl -s https://crates.io/api/v1/crates/omni-mdx | jq -r ".versions[] | select(.num == \"$VERSION\") | .num" | grep -c "$VERSION" || true)

          if [ "$EXISTS" -gt "0" ]; then
            echo "⚠️ Version $VERSION already exists on crates.io. Skipping publish step."
          else
            echo "🚀 Publishing version $VERSION..."
            cargo publish
          fi

      - name: Update GitHub Release (Rust)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry_run == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          draft: true