name: Publish Rust Crate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check if the crate is valid without publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: core-parser

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify build
        run: cargo check --features wasm,python,dev-tools

      - name: Run core tests
        run: cargo test --features wasm,python

      - name: Dry Run (Optional)
        if: ${{ inputs.dry_run == true }}
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: ${{ inputs.dry_run == false }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish