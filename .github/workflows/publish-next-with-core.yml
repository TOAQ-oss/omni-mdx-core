name: Publish @toaq-oss/omni-mdx

on:
  push:
    branches:
      - main
    paths:
      - 'core-parser/**'
  workflow_dispatch:
    inputs:
      skip_native:
        description: 'Skip native build (use existing .node artifacts on npm)'
        type: boolean
        default: false

jobs:
  build-native:
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win32-x64-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli

      - name: Build native addon
        working-directory: core-parser
        run: napi build --platform --release --features node --target ${{ matrix.target }} --no-js

      - name: Create platform subpackage
        shell: bash
        run: |
          PKG_NAME="@toaq-oss/omni-mdx-${{ matrix.name }}"
          NODE_FILE=$(ls core-parser/omni-mdx-core.*.node | head -1)
          mkdir -p platform-pkg
          cp "$NODE_FILE" "platform-pkg/omni-mdx-core.${{ matrix.name }}.node"
          cat > platform-pkg/package.json << PKGJSON
          {
            "name": "$PKG_NAME",
            "version": "0.2.5",
            "description": "Native addon for @toaq-oss/omni-mdx (${{ matrix.name }})",
            "license": "MIT",
            "main": "omni-mdx-core.${{ matrix.name }}.node",
            "files": ["omni-mdx-core.${{ matrix.name }}.node"],
            "os": ["$(echo ${{ matrix.name }} | cut -d- -f1)"],
            "cpu": ["$(echo ${{ matrix.name }} | cut -d- -f2)"],
            "repository": {
              "type": "git",
              "url": "git+https://github.com/TOAQ-oss/omni-mdx-core.git"
            }
          }
          PKGJSON

      - name: Publish platform subpackage
        working-directory: platform-pkg
        run: npm publish --access public

      - name: Upload .node artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: core-parser/omni-mdx-core.*.node
          retention-days: 1

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WASM
        working-directory: core-parser
        run: wasm-pack build --target web --features wasm

      - name: Clean wasm-pack generated files
        working-directory: core-parser/pkg
        run: rm -f package.json README.md

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: core-parser/pkg/
          retention-days: 1

  publish:
    needs: [build-native, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all native .node artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages/mdx-next/native/
          merge-multiple: true

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: packages/mdx-next/wasm/

      - name: Install dependencies
        working-directory: packages/mdx-next
        run: npm install --ignore-scripts

      - name: Build JS package
        working-directory: packages/mdx-next
        run: npm run build

      - name: Publish @toaq-oss/omni-mdx
        working-directory: packages/mdx-next
        run: npm publish --access public