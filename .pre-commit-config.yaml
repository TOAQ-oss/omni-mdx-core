repos:
-   repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Check if the code is formatted
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: Check the package for errors.
        entry: cargo check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint the code with Clippy.
        entry: cargo clippy -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false