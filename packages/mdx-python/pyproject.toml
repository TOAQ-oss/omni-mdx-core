[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "omni-mdx"
version = "0.1.12"
description = "Ultra-fast MDX rendering engine powered by Rust and WebAssembly."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["mdx", "rust", "parser"]

[project.urls]
"Homepage" = "https://github.com/TOAQ-oss/omni-mdx-core"
"Bug Tracker" = "https://github.com/TOAQ-oss/omni-mdx-core/issues"
"Source Code" = "https://github.com/TOAQ-oss/omni-mdx-core"

[tool.maturin]
manifest-path = "../../core-parser/Cargo.toml"
features = ["python"]
python-source = "."
module-name = "omni_mdx.omni_mdx_core"

[tool.pytest.ini_options]
testpaths = ["tests"]