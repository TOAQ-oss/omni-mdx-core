[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "omni-mdx"
version = "1.1.0"
description = "Ultra-fast MDX rendering engine powered by Rust."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["mdx", "markdown", "parser", "rust", "pyo3", "performance", "security"]
authors = [
    { name = "Côme Bruneteau", email = "oss@toaq.fr" },
    { name = "TOAQ-oss" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup",
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable"
]

[project.urls]
"Homepage" = "https://omni-core.org"
"Bug Tracker" = "https://github.com/TOAQ-oss/omni-mdx-core/issues"
"Source Code" = "https://github.com/TOAQ-oss/omni-mdx-core"

[tool.maturin]
manifest-path = "../../core-parser/Cargo.toml"
features = ["python"]
python-source = "."
module-name = "omni_mdx.omni_mdx_core"

[tool.pytest.ini_options]
testpaths = ["tests"]